name: Realtime A-share Quotes

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/realtime-quotes.yml"
      - ".github/workflows/reusable-a-share-quotes.yml"
      - ".github/workflows/reusable-selftest.yml"
      - ".github/workflows/v1-smoke.yml"
      - "scripts/realtime_quotes_watchlist.py"
      - "scripts/realtime_quotes_watchlist_runner.py"
      - "scripts/intraday_metrics.py"
      - "scripts/daily_k_context.py"
      - "scripts/history_store.py"
      - "scripts/live_price_guard.py"
      - "scripts/quote_resilience.py"
      - "scripts/transport_security.py"
      - "scripts/config_security.py"
      - "scripts/prepare_reusable_config.py"
      - "scripts/test_config_security.py"
      - "scripts/test_workflow_security.py"
      - "scripts/test_quote_resilience.py"
      - "config/quote_watchlist.json"

permissions:
  contents: read

jobs:
  fetch-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout persistent market history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: market-data
          path: .market-data
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch realtime A-share watchlist
        shell: bash
        env:
          MARKET_HISTORY_DIR: .market-data/history
        run: python3 scripts/realtime_quotes_watchlist_runner.py

      - name: Upload realtime snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: realtime-snapshot
          path: snapshot.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload market history state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: market-history-state
          path: .market-data/history
          if-no-files-found: error
          retention-days: 1

  persist-history:
    if: github.ref_name == 'master' && github.event_name != 'pull_request'
    needs: fetch-quotes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    concurrency:
      group: market-history-persist
      cancel-in-progress: false

    steps:
      - name: Checkout market-data branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: market-data
          fetch-depth: 1

      - name: Restore generated history state
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: market-history-state
          path: history

      - name: Persist market history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          if git diff --cached --quiet; then
            echo "HISTORY_PERSIST no changes"
            exit 0
          fi
          git commit -m "Persist market history run ${GITHUB_RUN_ID}"
          git push origin HEAD:market-data
