name: Realtime A-share Quotes

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode: auto selects intraday fast only during the A-share market window"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - intraday_fast
          - full
  push:
    paths:
      - ".github/workflows/realtime-quotes.yml"
      - ".github/workflows/persist-market-history.yml"
      - ".github/workflows/reusable-a-share-quotes.yml"
      - ".github/workflows/reusable-selftest.yml"
      - ".github/workflows/pre-merge-security-gate.yml"
      - ".github/workflows/v1-smoke.yml"
      - "requirements-event-facts.txt"
      - "scripts/realtime_quotes_watchlist.py"
      - "scripts/realtime_quotes_watchlist_runner.py"
      - "scripts/performance_fast_path.py"
      - "scripts/intraday_fast_tail.py"
      - "scripts/event_fact_continuity.py"
      - "scripts/history_continuity.py"
      - "scripts/resolve_previous_realtime_run.py"
      - "scripts/intraday_metrics.py"
      - "scripts/daily_k_context.py"
      - "scripts/history_store.py"
      - "scripts/live_price_guard.py"
      - "scripts/quote_resilience.py"
      - "scripts/market_environment.py"
      - "scripts/market_breadth_source.py"
      - "scripts/data_metadata.py"
      - "scripts/data_policy.py"
      - "scripts/data_policy_bridge.py"
      - "scripts/changes_metadata_bridge.py"
      - "scripts/changes_since_previous.py"
      - "scripts/changes_comparability.py"
      - "scripts/company_events.py"
      - "scripts/company_event_coverage.py"
      - "scripts/company_event_facts.py"
      - "scripts/company_event_metadata.py"
      - "scripts/transport_security.py"
      - "scripts/config_security.py"
      - "scripts/prepare_reusable_config.py"
      - "scripts/test_config_security.py"
      - "scripts/test_workflow_security.py"
      - "scripts/test_intraday_fast.py"
      - "scripts/test_event_fact_continuity.py"
      - "scripts/test_history_continuity.py"
      - "scripts/test_quote_resilience.py"
      - "scripts/test_market_environment.py"
      - "scripts/test_data_metadata.py"
      - "scripts/test_data_policy.py"
      - "scripts/test_changes_since_previous.py"
      - "scripts/test_changes_comparability.py"
      - "scripts/test_company_events.py"
      - "scripts/test_company_event_coverage.py"
      - "scripts/test_company_event_facts.py"
      - "scripts/test_company_event_metadata.py"
      - "config/quote_watchlist.json"

permissions:
  contents: read

concurrency:
  group: realtime-a-share-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve execution mode
        id: execution-mode
        shell: bash
        env:
          REQUESTED_MODE: ${{ github.event.inputs.mode || 'AUTO' }}
        run: |
          mode="$(PYTHONPATH=scripts python3 - <<'PY'
          import os
          import performance_fast_path
          import realtime_quotes_watchlist as base
          print(performance_fast_path.resolve_mode(base, requested=os.environ.get("REQUESTED_MODE")))
          PY
          )"
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "EXECUTION_MODE_RESOLVED requested=${REQUESTED_MODE} mode=${mode}"

      - name: Install pinned event-fact parser
        if: steps.execution-mode.outputs.mode == 'FULL'
        run: python3 -m pip install --disable-pip-version-check --no-deps --require-hashes -r requirements-event-facts.txt

      - name: Resolve exact previous successful master run
        id: previous-realtime
        if: github.ref_name == 'master'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/resolve_previous_realtime_run.py

      - name: Restore exact previous successful history artifact
        id: previous-history-artifact
        if: github.ref_name == 'master' && steps.previous-realtime.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: market-history-state
          path: .previous-realtime-history
          run-id: ${{ steps.previous-realtime.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Checkout persistent market history fallback
        if: github.ref_name != 'master' || steps.previous-realtime.outputs.run_id == '' || steps.previous-history-artifact.outcome != 'success'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: market-data
          path: .market-data
          fetch-depth: 1
          persist-credentials: false

      - name: Hydrate exact previous successful baseline
        if: github.ref_name == 'master' && steps.previous-realtime.outputs.run_id != '' && steps.previous-history-artifact.outcome == 'success'
        shell: bash
        run: >-
          python3 scripts/history_continuity.py hydrate
          --current .market-data/history
          --incoming .previous-realtime-history
          --expected-run-id '${{ steps.previous-realtime.outputs.run_id }}'

      - name: Verify fallback baseline is not behind previous success
        if: github.ref_name == 'master' && steps.previous-realtime.outputs.run_id != '' && steps.previous-history-artifact.outcome != 'success'
        shell: bash
        run: >-
          python3 scripts/history_continuity.py verify
          --current .market-data/history
          --expected-run-id '${{ steps.previous-realtime.outputs.run_id }}'
          --expected-started-at '${{ steps.previous-realtime.outputs.started_at }}'

      - name: Fetch realtime A-share watchlist
        shell: bash
        env:
          MARKET_HISTORY_DIR: .market-data/history
          LOOKLOOK_EXECUTION_MODE: ${{ steps.execution-mode.outputs.mode }}
        run: python3 scripts/realtime_quotes_watchlist_runner.py

      - name: Upload realtime snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: realtime-snapshot
          path: snapshot.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload market history state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: market-history-state
          path: .market-data/history
          if-no-files-found: error
          retention-days: 1
