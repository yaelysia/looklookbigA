name: Realtime A-share Quotes

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/realtime-quotes.yml"
      - "scripts/realtime_quotes_watchlist.py"
      - "config/quote_watchlist.json"

permissions:
  contents: read

jobs:
  fetch-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - name: Fetch realtime A-share watchlist
        shell: bash
        run: python3 scripts/realtime_quotes_watchlist.py

      - name: Upload realtime snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realtime-snapshot
          path: snapshot.json
          if-no-files-found: error
          retention-days: 1
