name: Realtime A-share Quotes

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/realtime-quotes.yml"
      - "scripts/realtime_quotes.py"

permissions:
  contents: read

jobs:
  fetch-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - name: Fetch realtime A-share quotes
        shell: bash
        run: python3 scripts/realtime_quotes.py
