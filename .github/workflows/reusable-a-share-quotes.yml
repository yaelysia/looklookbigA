name: Reusable A-share Quote Snapshot

on:
  workflow_call:
    inputs:
      source_ref:
        description: Ref of yaelysia/looklookbigA to execute (master, v1, tag, or commit SHA).
        required: false
        type: string
        default: master
      config_path:
        description: Quote watchlist JSON path in the caller repository. Used when config_json is empty.
        required: false
        type: string
        default: config/quote_watchlist.json
      config_json:
        description: Optional inline quote_watchlist JSON. Takes precedence over config_path.
        required: false
        type: string
        default: ""
      enable_history_cache:
        description: Reuse daily-K history through the caller repository's GitHub Actions cache.
        required: false
        type: boolean
        default: true
      cache_namespace:
        description: Namespace for reusable daily-K cache isolation.
        required: false
        type: string
        default: default
      snapshot_artifact_name:
        description: Artifact name containing snapshot.json.
        required: false
        type: string
        default: realtime-snapshot
      retention_days:
        description: Snapshot artifact retention days.
        required: false
        type: number
        default: 1

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          path: .caller
          persist-credentials: false

      - name: Checkout looklookbigA engine
        uses: actions/checkout@v4
        with:
          repository: yaelysia/looklookbigA
          ref: ${{ inputs.source_ref }}
          path: .engine
          fetch-depth: 1
          persist-credentials: false

      - name: Validate watchlist configuration
        shell: bash
        env:
          CONFIG_JSON: ${{ inputs.config_json }}
          CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          python3 .engine/scripts/reusable_input_guard.py \
            --caller-root .caller \
            --config-path "$CONFIG_PATH" \
            --config-json "$CONFIG_JSON" \
            --engine-default .engine/config/quote_watchlist.json \
            --output .engine/config/quote_watchlist.json

      - name: Restore reusable daily-K cache
        if: ${{ inputs.enable_history_cache }}
        id: history-cache
        uses: actions/cache/restore@v4
        with:
          path: .engine/.reusable-history/history
          key: looklookbigA-${{ runner.os }}-${{ github.repository_id }}-${{ inputs.cache_namespace }}-${{ github.run_id }}
          restore-keys: |
            looklookbigA-${{ runner.os }}-${{ github.repository_id }}-${{ inputs.cache_namespace }}-

      - name: Generate realtime snapshot
        shell: bash
        env:
          MARKET_HISTORY_DIR: ${{ github.workspace }}/.engine/.reusable-history/history
        run: |
          cd .engine
          python3 scripts/realtime_quotes_watchlist_runner.py

      - name: Upload realtime snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.snapshot_artifact_name }}
          path: .engine/snapshot.json
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Save reusable daily-K cache
        if: ${{ inputs.enable_history_cache && success() }}
        uses: actions/cache/save@v4
        with:
          path: .engine/.reusable-history/history
          key: looklookbigA-${{ runner.os }}-${{ github.repository_id }}-${{ inputs.cache_namespace }}-${{ github.run_id }}
