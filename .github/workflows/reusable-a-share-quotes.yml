name: Reusable A-share Quote Snapshot

on:
  workflow_call:
    inputs:
      source_ref:
        description: Optional immutable 40-character engine commit SHA override. Empty binds to the exact commit that defines this reusable workflow.
        required: false
        type: string
        default: ""
      config_path:
        description: Quote watchlist JSON path inside the caller repository. Used when config_json is empty.
        required: false
        type: string
        default: config/quote_watchlist.json
      config_json:
        description: Optional inline quote_watchlist JSON. Takes precedence over config_path.
        required: false
        type: string
        default: ""
      execution_mode:
        description: AUTO, INTRADAY_FAST/FAST, or FULL. AUTO selects fast only during the A-share market window.
        required: false
        type: string
        default: AUTO
      enable_history_cache:
        description: Reuse daily-K history through the caller repository's GitHub Actions cache.
        required: false
        type: boolean
        default: true
      cache_namespace:
        description: Namespace for reusable daily-K cache isolation.
        required: false
        type: string
        default: default
      snapshot_artifact_name:
        description: Artifact name containing snapshot.json.
        required: false
        type: string
        default: realtime-snapshot
      retention_days:
        description: Snapshot artifact retention days.
        required: false
        type: number
        default: 1

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read

    steps:
      - name: Resolve immutable engine revision
        id: engine-ref
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ -n "$SOURCE_REF" ]]; then
            if [[ ! "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "source_ref must be an immutable 40-character commit SHA when explicitly provided" >&2
              exit 1
            fi
            engine_ref="${SOURCE_REF,,}"
            mode="explicit-sha"
          else
            if [[ ! "$WORKFLOW_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "job.workflow_sha is unavailable or invalid" >&2
              exit 1
            fi
            engine_ref="${WORKFLOW_SHA,,}"
            mode="called-workflow-sha"
          fi
          echo "ref=$engine_ref" >> "$GITHUB_OUTPUT"
          echo "ENGINE_REVISION mode=$mode sha=$engine_ref"

      - name: Checkout caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: .caller
          persist-credentials: false

      - name: Checkout looklookbigA engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: yaelysia/looklookbigA
          ref: ${{ steps.engine-ref.outputs.ref }}
          path: .engine
          fetch-depth: 1
          persist-credentials: false

      - name: Verify engine revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.engine-ref.outputs.ref }}
        run: |
          set -euo pipefail
          actual="$(git -C .engine rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "engine checkout mismatch: expected=$EXPECTED_SHA actual=$actual" >&2
            exit 1
          fi
          echo "ENGINE_REVISION_VERIFIED sha=$actual"

      - name: Resolve execution mode
        id: execution-mode
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.execution_mode }}
        run: |
          mode="$(cd .engine && PYTHONPATH=scripts python3 - <<'PY'
          import os
          import performance_fast_path
          import realtime_quotes_watchlist as base
          print(performance_fast_path.resolve_mode(base, requested=os.environ.get("REQUESTED_MODE")))
          PY
          )"
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "EXECUTION_MODE_RESOLVED requested=${REQUESTED_MODE} mode=${mode}"

      - name: Install pinned event-fact parser
        if: steps.execution-mode.outputs.mode == 'FULL'
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --no-deps --require-hashes -r .engine/requirements-event-facts.txt

      - name: Restore reusable daily-K cache
        if: ${{ inputs.enable_history_cache }}
        id: history-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .engine/.reusable-history/history
          key: looklookbigA-${{ runner.os }}-${{ github.repository_id }}-${{ inputs.cache_namespace }}-${{ github.run_id }}
          restore-keys: |
            looklookbigA-${{ runner.os }}-${{ github.repository_id }}-${{ inputs.cache_namespace }}-

      - name: Resolve and validate watchlist configuration
        shell: bash
        env:
          CONFIG_JSON: ${{ inputs.config_json }}
          CONFIG_PATH: ${{ inputs.config_path }}
          CALLER_ROOT: ${{ github.workspace }}/.caller
          ENGINE_CONFIG: ${{ github.workspace }}/.engine/config/quote_watchlist.json
        run: python3 .engine/scripts/prepare_reusable_config.py

      - name: Generate realtime snapshot
        shell: bash
        env:
          MARKET_HISTORY_DIR: ${{ github.workspace }}/.engine/.reusable-history/history
          LOOKLOOK_EXECUTION_MODE: ${{ steps.execution-mode.outputs.mode }}
        run: |
          cd .engine
          python3 scripts/realtime_quotes_watchlist_runner.py

      - name: Upload realtime snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.snapshot_artifact_name }}
          path: .engine/snapshot.json
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Save reusable daily-K cache
        if: ${{ inputs.enable_history_cache && success() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .engine/.reusable-history/history
          key: looklookbigA-${{ runner.os }}-${{ github.repository_id }}-${{ inputs.cache_namespace }}-${{ github.run_id }}
