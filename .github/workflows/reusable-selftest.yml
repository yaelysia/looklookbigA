name: Reusable Workflow Selftest

on:
  push:
    paths:
      - "README.md"
      - "docs/STABLE_V1.md"
      - "docs/SECURITY_BRANCH_PROTECTION.md"
      - "docs/DATA_PROVENANCE.md"
      - "docs/CHANGES_SINCE_PREVIOUS.md"
      - "docs/COMPANY_EVENTS.md"
      - "vite.config.ts"
      - ".github/workflows/reusable-a-share-quotes.yml"
      - ".github/workflows/reusable-selftest.yml"
      - ".github/workflows/pre-merge-security-gate.yml"
      - ".github/workflows/realtime-quotes.yml"
      - ".github/workflows/v1-smoke.yml"
      - ".github/dependabot.yml"
      - "config/quote_watchlist.json"
      - "scripts/realtime_quotes_watchlist.py"
      - "scripts/realtime_quotes_watchlist_runner.py"
      - "scripts/intraday_metrics.py"
      - "scripts/daily_k_context.py"
      - "scripts/history_store.py"
      - "scripts/live_price_guard.py"
      - "scripts/quote_resilience.py"
      - "scripts/market_environment.py"
      - "scripts/market_breadth_source.py"
      - "scripts/data_metadata.py"
      - "scripts/changes_since_previous.py"
      - "scripts/company_events.py"
      - "scripts/company_event_facts.py"
      - "scripts/company_event_metadata.py"
      - "scripts/transport_security.py"
      - "scripts/config_security.py"
      - "scripts/prepare_reusable_config.py"
      - "scripts/test_live_price_guard.py"
      - "scripts/test_quote_resilience.py"
      - "scripts/test_market_environment.py"
      - "scripts/test_data_metadata.py"
      - "scripts/test_changes_since_previous.py"
      - "scripts/test_company_events.py"
      - "scripts/test_company_event_facts.py"
      - "scripts/test_config_security.py"
      - "scripts/test_workflow_security.py"
      - "worker/index.ts"
      - "worker/abuse-protection.js"
      - "worker/stock-quote.js"
      - "tests/worker-abuse-protection.test.mjs"

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run live-price guard fault-injection tests
        run: python3 scripts/test_live_price_guard.py
      - name: Run quote resilience selection tests
        run: python3 scripts/test_quote_resilience.py
      - name: Run watchlist/config boundary tests
        run: python3 scripts/test_config_security.py
      - name: Run workflow supply-chain and transport tests
        run: python3 scripts/test_workflow_security.py
      - name: Run market environment summary tests
        run: python3 scripts/test_market_environment.py
      - name: Run provenance/freshness/quality metadata tests
        run: python3 scripts/test_data_metadata.py
      - name: Run changes-since-previous tests
        run: python3 scripts/test_changes_since_previous.py
      - name: Run structured company event tests
        run: python3 scripts/test_company_events.py
      - name: Run official PDF event fact tests
        run: python3 scripts/test_company_event_facts.py
      - name: Run public quote abuse-protection tests
        run: node --test tests/worker-abuse-protection.test.mjs

  reusable-selftest:
    uses: ./.github/workflows/reusable-a-share-quotes.yml
    with:
      enable_history_cache: true
      cache_namespace: reusable-selftest
      snapshot_artifact_name: reusable-selftest-snapshot
      retention_days: 1
      config_json: >-
        {"detail_codes":["002558"],"light_codes":["002555","002517"],"groups":{"game_smoke":{"label":"游戏股复用工作流冒烟测试","target_code":"002558","member_codes":["002555","002517"]}},"max_total_codes":10,"event_lookback_days":7}
