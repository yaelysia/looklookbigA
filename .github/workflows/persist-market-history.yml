name: Persist Market History

on:
  workflow_run:
    workflows:
      - Realtime A-share Quotes
    branches:
      - master
    types:
      - completed

permissions:
  contents: read

jobs:
  persist-history:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: write
    concurrency:
      group: market-history-persist
      cancel-in-progress: false

    steps:
      - name: Checkout market-data branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: market-data
          fetch-depth: 1

      - name: Checkout exact realtime engine revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: .engine
          fetch-depth: 1
          persist-credentials: false

      - name: Restore generated history state from completed realtime run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: market-history-state
          path: .incoming-history
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Apply monotonic history update
        shell: bash
        run: >-
          python3 .engine/scripts/history_continuity.py persist
          --current history
          --incoming .incoming-history
          --expected-run-id '${{ github.event.workflow_run.id }}'

      - name: Persist market history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          if git diff --cached --quiet; then
            echo "HISTORY_PERSIST no changes (already current or incoming run is older)"
            exit 0
          fi
          git commit -m "Persist market history run ${{ github.event.workflow_run.id }}"
          git push origin HEAD:market-data
